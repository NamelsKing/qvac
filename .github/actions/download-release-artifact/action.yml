name: Download release artifact (with expiry guard)
description: >
  Download a build artifact produced earlier in the run. When the artifact has
  expired (GitHub Actions retention window elapsed while a release run waited
  for manual approval), fail fast with an actionable message instead of the
  cryptic "Artifact not found" download error.

inputs:
  name:
    description: "Artifact name to download"
    required: true
  path:
    description: "Destination path for the downloaded artifact"
    required: true

runs:
  using: composite
  steps:
    - name: Download build artifact
      id: dl
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Guard against expired artifact
      if: steps.dl.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        echo "::error title=Build artifact expired::The '${ARTIFACT_NAME}' build artifact is no longer available (GitHub Actions retention window elapsed while this run waited for release approval). Re-running ONLY the failed jobs will NOT help because the artifact is gone for good. Re-run the ENTIRE workflow ('Re-run all jobs') or re-trigger it (push / workflow_dispatch) on the release branch so the build job regenerates the artifact before publish."
        exit 1
